name: main-ci

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-validation
  cancel-in-progress: false

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  contract:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Disable external telemetry
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/telemetry@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
        with:
          rust-version: '1.99.1'
          rust-components: rustfmt,clippy
          tools: cargo-audit@0.22.2,cargo-deny@0.20.2,cargo-nextest@0.9.149
      - name: Restore the Cargo dependency and tool cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: native-contract
          add-job-id-key: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Prepare locked source inputs
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
        with:
          recipe: setup
      - name: Check source without compiling
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
        with:
          recipe: check
      - name: Run the native project commands
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
        with:
          recipe: verify

  matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Disable external telemetry
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/telemetry@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
        with:
          rust-version: '1.99.1'
          rust-components: rustfmt,clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Native transport tests
        run: cargo test --locked --workspace
      - name: Install verified prebuilt Rust quality tools
        if: runner.os == 'Linux'
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
        with:
          tools: cargo-audit@0.22.2,cargo-deny@0.20.2,cargo-nextest@0.9.149
      - name: Dependency policy and advisory checks
        if: runner.os == 'Linux'
        run: |
          cargo deny check
          cargo audit --deny warnings
      - name: Fetch verified native provider
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail --location --connect-timeout 10 --max-time 60 https://raw.githubusercontent.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-agent/4de5a6010a01b34bf3b7a1a3b82b317bbc585019/scripts/fetch-provider.py --output "$RUNNER_TEMP/fetch-provider.py"
          python3 "$RUNNER_TEMP/fetch-provider.py" provider.lock.json "$RUNNER_TEMP/native-provider"
      - name: Real isolated native provider acceptance
        if: runner.os == 'Linux'
        run: cargo test --locked --test provider -- --ignored
