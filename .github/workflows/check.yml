name: NDS checks

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  quality:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Disable external telemetry
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/telemetry@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
        with:
          rust-version: '1.99.1'
          rust-components: rustfmt,clippy
          tools: cargo-audit@0.22.2,cargo-deny@0.20.2,cargo-nextest@0.9.149
      - name: Restore the Cargo dependency and tool cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: native-contract
          add-job-id-key: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Prepare locked source inputs
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
        with:
          recipe: setup
      - name: Check source without compiling
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
        with:
          recipe: check
      - name: Run the native project commands
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
        with:
          recipe: test
      - name: Fetch verified standalone Systeminfo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --connect-timeout 10 --max-time 60 https://raw.githubusercontent.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-agent/4de5a6010a01b34bf3b7a1a3b82b317bbc585019/scripts/fetch-provider.py --output "$RUNNER_TEMP/fetch-provider.py"
          python3 "$RUNNER_TEMP/fetch-provider.py" provider.lock.json "$RUNNER_TEMP/native-provider"
      - name: Read a real released provider sample
        run: cargo test --locked --test provider -- --ignored

  merge-stops:
    permissions:
      contents: read
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/merge-stops.yml@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
    with:
      hosted-runner: ubuntu-26.04
